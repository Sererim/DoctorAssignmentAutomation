<script>

window.applyAssetCssVariables = function(baseUrl) {
  var normalizedUrl = baseUrl || '/login/';
  if (normalizedUrl.charAt(normalizedUrl.length - 1) !== '/') {
    normalizedUrl += '/';
  }

  document.documentElement.style.setProperty(
    '--loader-throbber',
    'url("' + normalizedUrl + 'assets/gif/throbber-hexagon.gif")'
  );
};

window.preloadFontAssets = function(baseUrl) {
  var normalizedUrl = baseUrl || '/login/';
  if (normalizedUrl.charAt(normalizedUrl.length - 1) !== '/') {
    normalizedUrl += '/';
  }

  var fonts = [
    normalizedUrl + 'assets/fonts/Lato-Regular.woff2',
    normalizedUrl + 'assets/fonts/Lato-Bold.woff2'
  ];

  fonts.forEach(function(fontUrl) {
    var link = document.createElement('link');
    link.rel = 'preload';
    link.href = fontUrl;
    link.as = 'font';
    link.type = 'font/woff2';
    link.crossOrigin = 'anonymous';
    document.head.appendChild(link);
  });
};

window.loadStylesheets = function(baseUrl) {
  var normalizedUrl = baseUrl || '/login/';
  if (normalizedUrl.charAt(normalizedUrl.length - 1) !== '/') {
    normalizedUrl += '/';
  }

  const stylesheetsToLoad = [
  "styles.21ac9ed7a5454664.css",
  "styles.21ac9ed7a5454664.css"
];

  stylesheetsToLoad.forEach(function(stylesheetHref) {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = normalizedUrl + stylesheetHref;
    document.head.appendChild(link);
  });
};

window.loadFavicon = function(baseUrl) {
  var normalizedUrl = baseUrl || '/login/';
  if (normalizedUrl.charAt(normalizedUrl.length - 1) !== '/') {
    normalizedUrl += '/';
  }

  const faviconsToLoad = [
  "favicon.ico"
];

  faviconsToLoad.forEach(function(faviconHref) {
    var link = document.createElement('link');
    link.rel = 'icon';
    link.type = 'image/x-icon';
    link.href = normalizedUrl + faviconHref;
    document.head.appendChild(link);
  });
};

window.loadScriptsSequentially = function(url) {
  const scriptsToLoad = [
  "runtime.1e75f89a579272c5.js",
  "polyfills.f726bece464182d2.js",
  "main.accc19b713129ded.js"
];

  scriptsToLoad.forEach(function(scriptSrc) {
    var script = document.createElement('script');
    script.src = url + scriptSrc;
    script.type = 'text/javascript';
    script.async = false;
    document.head.appendChild(script);
  });
};

try {
  function injectScripts() {
      window.loadScriptsSequentially(window.__cdnBaseUrl || '/login/');
  }

  function initApp() {
    if (!window.__baseApplied) {
      document.querySelector('esia-waiting-room')?.remove();

      const xhr = new XMLHttpRequest();
      xhr.open('GET', '/aas/oauth2/config', false);
      xhr.send();

      const config = xhr.status === 200 ? JSON.parse(xhr.responseText) : null;
      const url = config ? config['static.domain.url'] : '/login/';

      window.esiaConfig = config;
      window.__cdnBaseUrl = url;
      window.preloadFontAssets(url)
      window.applyAssetCssVariables(url)
      window.loadStylesheets(url)
      window.loadFavicon(url)

      injectScripts();

      window.__baseApplied = true;
    }
  }

  function getWrStatus() {
      const xhr = new XMLHttpRequest();

      xhr.timeout = 3000;

      xhr.open('GET', '/waiting-room/api/public/v1/waiting-room/check', true);

      xhr.onload = function () {
        if (xhr.status === 200) {
          try {
            const wrStatus = JSON.parse(xhr.responseText);
            sessionStorage.setItem('wrStatus', JSON.stringify(wrStatus));
             window.wrStatus = wrStatus;

             if (window.wrStatus && window.wrStatus.wr_enabled) {
                window.wrDate = window.wrStatus.wr_timer_ttl_seconds;
             }

            if (!(window.wrStatus && window.wrStatus.wr_enabled)) {
              initApp();
            } else {
              injectEsiaWaitingRoom();
            }

              if (window.wrStatus && window.wrStatus.wr_enabled) {
                window.wrDate = window.wrStatus.wr_timer_ttl_seconds;
              }

              if (!activeWr && !(window.wrStatus && window.wrStatus.wr_enabled)) {
                initApp();
              }
          } catch (e) {
            console.error(e)
            initApp();
          }
        } else {
            console.error(xhr.status);
            initApp();
        }
      };

      xhr.onerror = function() {
          initApp();
      };

      xhr.send();
  }

  function wrTimer() {
    const dateFromStorage = sessionStorage.getItem('wrDate');

    let differenceInSeconds = null;

    if (dateFromStorage) {
      differenceInSeconds =
        (new Date(dateFromStorage).getTime() - new Date().getTime()) / 1000;
    }

    if (differenceInSeconds <= 0) {
      sessionStorage.removeItem('wrDate');
      sessionStorage.removeItem('wrStatus');
    }

    return differenceInSeconds > 0 ? differenceInSeconds : null;
  }

  const activeWr = wrTimer();
  const wrStatusFromStore = JSON.parse(sessionStorage.getItem('wrStatus'))

  if (!activeWr) {
    try {
      getWrStatus();
    } catch (e) {
      console.error(e);
      initApp();
    }
  } else if (wrStatusFromStore) {
    window.wrStatus = JSON.parse(sessionStorage.getItem('wrStatus'));
    injectEsiaWaitingRoom();
  } else {
    getWrStatus();
  }


} catch (e) {
  window.__cdnBaseUrl = '/login/';
  window.preloadFontAssets('/login/');
  window.applyAssetCssVariables('/login/');
  window.loadStylesheets('/login/');
  window.loadFavicon('/login/');
  injectScripts();
}
